<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>HTML FORM</h1>
    <hr>

    <form action="./controller.html">
        <label for="f_name">first name: </label>
        <input id="f_name" type="text" placeholder="enter your first name">




        <br><br>


        <label for="l_name">last name :</label>
        <input id="l_name" type="text" placeholder="last name">

        <br><br>
        <label for="email">Email : </label>
        <input required id="email" type="email" placeholder="enter an valid email">


        <br><br>
        <label for="password">password: </label>
        <input type="password" placeholder="password">


        <br><br>
        <label for="phone_number">phone number: </label>
        <input type="number" placeholder="phone number">


        <br><br>
        <label for="birth_date">birth date: </label>
        <input id="birth_date" type="date">


        <br><br>
        <label for="birth_date_time">birth date and time: </label>
        <input id="birth_date_time" type="datetime-local">


        <br><br>
        <label for="details">Details: </label> <br>
        <textarea cols="50" rows="5" name="" id="" placeholder="details...."></textarea>


        <br><br>
        <label for="">select your division : </label>
        <select name="" id="">
            <option disabled selected>-----select your division-------</option>
            <option value="Barishal">Barishal</option>
            <option value="Chattogram">Chattogram</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Khulna">Khulna</option>
            <option value="Mymensingh">Mymensingh</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Rangpur">Rangpur</option>
            <option value="Sylhet">Sylhet</option>
        </select>


        <br><br>
        <label for="profile_img">   <img width="150" src="./ooo.avif" alt="">  </label>
        <input hidden id="profile_img" type="file" accept=".png">
        
        
        <br><br>
        <label for="color"> choose color :  </label>
        <input id="color" type="color">
        

        <br><br>
        <label for="">select your gender  : </label>

        
        
        <label for="women">women</label>
        <input name="gender" id="women" type="radio">
        

        <label for="man">man</label>
        <input name="gender" id="man" type="radio">

        
        
        <br> <br>
        <label for="chr">chr</label>
        <input type="checkbox" id="chr">
        
        <label for="prado">prado</label>
        <input type="checkbox" id="prado">
        
        <br><br>
        

        <label for="fav-book">Favorite Book:</label><br>
    <select id="fav-book" name="fav-book">
        <option value="">-- Select a Book --</option>
        <option value="poddoja">Poddoja</option>
        <option value="harry-potter">Harry Potter</option>
        <option value="shesher-kobita">Shesher Kobita</option>
        <option value="alchemist">The Alchemist</option>
    </select>
    <br><br>

    <label for="fav-song">Favourite Song:</label><br>
    <input type="text" id="fav-song" name="fav-song" placeholder="Ex: Tum Hi Ho">
    <br><br>

    <label>Hobby:</label><br>
    <input type="checkbox" id="reading" name="hobby">
    <label for="reading">Reading</label>
    <input type="checkbox" id="gardening" name="hobby">
    <label for="gardening">Gardening</label>
    <input type="checkbox" id="traveling" name="hobby">
    <label for="traveling">Traveling</label>
    <input type="checkbox" id="singing" name="hobby">
    <label for="singing">Singing</label>
    <br><br>

    <label for="fav-flower">Favorite Flower:</label><br>
    <select id="fav-flower" name="fav-flower">
        <option value="">-- Select Flower --</option>
        <option value="rose">Rose</option>
        <option value="belly">Beli (Jasmine)</option>
        <option value="sunflower">Sunflower</option>
        <option value="lily">Lily</option>
        <option value="tulip">Tulip</option>
    </select>
    <br><br>

    <input type="submit" value="Submit Form">

    </form>

</body>

</html>
